[ipmi]
ipmitool_path = ipmitool

[output]
log = /tmp/spinpid2.log
console = true
dry_run = false

[fans]
# Supermicro: zone 0 = FAN1.., zone 1 = FANA..
zone_cpu = 0
zone_per = 1
duty_cpu_min = 20
duty_cpu_max = 100
duty_per_min = 20
duty_per_max = 100
rpm_cpu_30 = 400
rpm_cpu_max = 3200
rpm_per_30 = 600
rpm_per_max = 1700

[drives]
# Comma-separated device paths. Example: /dev/sda,/dev/sdb,/dev/nvme0n1
devices = 
setpoint_c = 36
interval_minutes = 5
kp = 4.0
kd = 40.0

[cpu]
interval_seconds = 5
ref_c = 54
scale_per_c = 6
